model:
  vocab_size: 8000
  max_seq_len: 64
  n_layers: 2
  n_heads: 4
  d_model: 128
  head_dim: 32
  ffn_hidden_dim: 384
  dropout: 0.0
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  bias: false

data:
  train_path: data/processed/debug_tokens.pt
  val_path: null
  val_split: 0.01
  block_size: 64
  num_workers: 0

train:
  batch_size: 8
  max_steps: 100
  warmup_steps: 10
  lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 25
  eval_batches: 5
  save_interval: 50
  out_dir: llm/outputs/tiny
  resume_from: null
  seed: 1337
  device: auto
