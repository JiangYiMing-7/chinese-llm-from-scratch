model:
  vocab_size: 20000
  max_seq_len: 1024
  n_layers: 12
  n_heads: 12
  d_model: 768
  head_dim: 64
  ffn_hidden_dim: 2048
  dropout: 0.0
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  bias: false

data:
  train_path: data/processed/pretrain_tokens.bin
  val_path: null
  val_split: 0.01
  block_size: 1024
  num_workers: 0

train:
  batch_size: 16
  max_steps: 30500
  warmup_steps: 610
  lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 1000
  eval_batches: 100
  save_interval: 5000
  out_dir: llm/outputs/main
  resume_from: null
  seed: 1337
  device: auto
