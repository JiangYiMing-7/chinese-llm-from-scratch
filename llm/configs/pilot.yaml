model:
  vocab_size: 16000
  max_seq_len: 512
  n_layers: 8
  n_heads: 8
  d_model: 512
  head_dim: 64
  ffn_hidden_dim: 1536
  dropout: 0.0
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  bias: false

data:
  train_path: data/processed/pilot_tokens.bin
  val_path: null
  val_split: 0.01
  block_size: 512
  num_workers: 0

train:
  batch_size: 16
  max_steps: 1500
  warmup_steps: 30
  lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 200
  eval_batches: 50
  save_interval: 500
  out_dir: llm/outputs/pilot
  resume_from: null
  seed: 1337
  device: auto
