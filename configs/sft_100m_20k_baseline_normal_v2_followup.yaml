model:
  vocab_size: 20000
  max_seq_len: 1024
  n_layers: 12
  n_heads: 12
  d_model: 768
  head_dim: 64
  ffn_hidden_dim: 2048
  dropout: 0.0
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  bias: false

data:
  train_path: data/sft/normal_sft_500m_v2_train.jsonl
  val_path: data/sft/normal_sft_500m_v2_val.jsonl
  tokenizer_path: data/tokenizer/zh_bpe_20k.model
  max_seq_len: 1024
  num_workers: 0
  default_system: 你是一个中文助手，请根据用户任务给出准确、简洁的回答。

train:
  init_from: external_100m_20260614_flat/baseline_best.pt
  batch_size: 8
  eval_batch_size: 8
  max_steps: 1500
  warmup_steps: 100
  lr: 2.0e-5
  min_lr: 2.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  log_interval: 10
  metrics_interval: 1
  eval_interval: 100
  eval_batches: 50
  save_interval: 500
  run_dir_root: results/sft_runs
  run_name: sft_100m_20k_baseline_normal_v2_followup
  seed: 1337
  device: cuda
  precision: bf16
