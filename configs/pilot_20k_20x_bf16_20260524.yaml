model:
  vocab_size: 20000
  max_seq_len: 512
  n_layers: 8
  n_heads: 8
  d_model: 512
  head_dim: 64
  ffn_hidden_dim: 1536
  dropout: 0.0
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  bias: false

data:
  train_path: data/processed/pretrain_tokens.bin
  val_path: data/processed/pretrain_val_tokens.bin
  val_split: 0.0
  tokenizer_path: data/tokenizer/zh_bpe_20k.model
  block_size: 512
  num_workers: 0

train:
  batch_size: 32
  max_steps: 45791
  warmup_steps: 916
  lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  log_interval: 10
  metrics_interval: 1
  run_dir_root: results/runs
  run_name: pilot_20k_20x_bf16_20260524
  metrics_filename: metrics.jsonl
  hardware_metrics_interval: 10
  eval_interval: 1000
  eval_batches: 100
  save_interval: 5000
  save_best: true
  best_checkpoint_name: best.pt
  resume_from: null
  seed: 1337
  device: auto
  precision: bf16
  track_token_acc: true
  loss_ema_beta: 0.95
