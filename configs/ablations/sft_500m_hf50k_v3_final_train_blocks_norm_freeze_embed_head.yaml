model:
  vocab_size: 50000
  max_seq_len: 1024
  n_layers: 24
  n_heads: 20
  d_model: 1280
  head_dim: 64
  ffn_hidden_dim: 3456
  dropout: 0.0
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  bias: false

data:
  train_path: data/sft/normal_sft_500m_v3_final_train.jsonl
  val_path: data/sft/normal_sft_500m_v3_final_val.jsonl
  tokenizer_path: data/tokenizer/zh_bpe_hf50k_cci3hq_seed20260608.json
  max_seq_len: 1024
  num_workers: 0
  default_system: 你是一个中文助手，请根据用户任务给出准确、简洁的回答。

train:
  init_from: results/runs/main_500m_hf50k_10btok_bs8_bf16_4xpro6000_20260608_20260609_103529/checkpoints/best.pt
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 2000
  warmup_steps: 100
  lr: 1.0e-5
  min_lr: 1.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  log_interval: 10
  metrics_interval: 1
  eval_interval: 100
  eval_batches: 50
  save_interval: 500
  run_dir_root: results/sft_runs
  run_name: sft_500m_hf50k_v3_final_train_blocks_norm_freeze_embed_head
  seed: 20260629
  device: cuda
  precision: bf16
  freeze:
    mode: train_only
    groups:
      - attention
      - ffn
      - norms
