model:
  vocab_size: 20000
  max_seq_len: 1024
  n_layers: 12
  n_heads: 12
  d_model: 768
  head_dim: 64
  ffn_hidden_dim: 2048
  dropout: 0.0
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  bias: false

data:
  train_path: data/processed/pretrain_tokens.bin
  val_path: data/processed/pretrain_val_tokens.bin
  val_split: 0.0
  tokenizer_path: data/tokenizer/zh_bpe_20k.model
  block_size: 1024
  num_workers: 0

train:
  batch_size: 16
  gradient_accumulation_steps: 64
  max_steps: 1913
  warmup_steps: 38
  lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  log_interval: 1
  metrics_interval: 1
  run_dir_root: results/runs/100m_large_batch
  run_name: main_100m_2btok_batch_1mtok_accum64
  metrics_filename: metrics.jsonl
  hardware_metrics_interval: 1
  eval_interval: 16
  eval_batches: 100
  save_interval: 78
  save_best: true
  best_checkpoint_name: best.pt
  resume_from: null
  seed: 1337
  device: auto
  precision: bf16
  track_token_acc: true
  loss_ema_beta: 0.95

